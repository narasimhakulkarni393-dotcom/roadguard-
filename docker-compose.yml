services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pitscout-api
    ports:
      - "8001:8001"
    environment:
      ROADGUARD_API_KEY: ${ROADGUARD_API_KEY:?set ROADGUARD_API_KEY in your shell}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/backend/roadguard.db}
      DETECTION_PROVIDER: yolo
    volumes:
      - ./models:/app/models
      - ./backend/storage:/app/backend/storage
    restart: unless-stopped

# The Next.js frontend is deployed separately (Vercel or `npm run build && npm start`
# in ./frontend). It talks to this service through BACKEND_URL.
