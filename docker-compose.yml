version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadguard-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/storage/roadguard.db
      - DEBUG=true
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roadguard-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
